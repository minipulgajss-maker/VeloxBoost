name: Release

# Every push to main builds and publishes a new version automatically.
# Installed apps show "Update required" on next launch.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.gitignore']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        shell: bash
        run: echo "VERSION=1.2.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Publish
        run: dotnet publish VeloxBoost.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=${{ env.VERSION }}

      - name: Install vpk (Velopack)
        run: dotnet tool install -g vpk

      - name: Download previous release (delta updates)
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Pack
        run: vpk pack -u VeloxBoost -v ${{ env.VERSION }} -p publish -e VeloxBoost.exe --packTitle VeloxBoost --packAuthors VeloxBoost --icon Assets/icon.ico

      - name: Upload GitHub release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "VeloxBoost ${{ env.VERSION }}" --tag v${{ env.VERSION }} --token ${{ secrets.GITHUB_TOKEN }}

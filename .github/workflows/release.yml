name: Release

# Create a new version: git tag v1.0.1 && git push origin v1.0.1
# GitHub builds the app, creates Setup.exe and publishes the release. Installed apps update themselves.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$V" >> $GITHUB_ENV

      - name: Publish
        run: dotnet publish VeloxBoost.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=${{ env.VERSION }}

      - name: Install vpk (Velopack)
        run: dotnet tool install -g vpk

      - name: Download previous release (delta updates)
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Pack
        run: vpk pack -u VeloxBoost -v ${{ env.VERSION }} -p publish -e VeloxBoost.exe --packTitle VeloxBoost --packAuthors VeloxBoost --icon Assets/icon.ico

      - name: Upload GitHub release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "VeloxBoost ${{ env.VERSION }}" --tag v${{ env.VERSION }} --token ${{ secrets.GITHUB_TOKEN }}
